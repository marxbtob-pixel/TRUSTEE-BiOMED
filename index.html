<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUSTEE BiOMED 信賴生醫｜內部查詢系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#B8D6CE;
    --surface:#FFFFFF;
    --ink:#333333;
    --muted:#726F62;
    --border:#E4E0D2;
    --radius:14px;
    --radius-sm:8px;
    --shadow:0 2px 8px rgba(51,51,51,0.06);
    --shadow-lg:0 16px 36px rgba(51,51,51,0.12);
    --brand:#4C6B54;
    --brand-soft:#4C6B5417;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--brand); color:#fff;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  h1,h2,h3,h4{font-family:'Noto Serif TC',serif; margin:0; letter-spacing:.01em;}
  .mono{font-family:'Roboto Mono',monospace;}

  /* ===== Layout shell ===== */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(184,214,206,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .logo{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .logo-mark{
    width:44px; height:44px; border-radius:11px;
    background:linear-gradient(155deg,#20291F,#394A3B);
    display:flex; align-items:center; justify-content:center;
    color:#F7F5EF; font-family:'Noto Serif TC',serif; font-weight:700; font-size:17px;
    flex-shrink:0;
  }
  .logo-text .t1{font-family:'Noto Serif TC',serif; font-weight:700; font-size:21px; line-height:1.25; letter-spacing:.01em; white-space:nowrap;}
  .logo-text .t2{font-family:'Noto Sans TC',sans-serif; font-size:15px; color:var(--muted); font-weight:500; letter-spacing:.06em; margin-left:4px;}
  .topbar-nav{display:flex; align-items:center; gap:6px; margin-left:32px; flex:1;}
  .topbar-nav-link{
    display:flex; align-items:center; gap:6px; font-size:17px; font-weight:700; color:var(--ink);
    padding:9px 16px; border-radius:8px; cursor:pointer; white-space:nowrap; transition:background .15s, color .15s;
  }
  .topbar-nav-link:hover{background:var(--surface); color:var(--ink);}
  .topbar-nav-link.active{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:var(--shadow);}
  .topbar-nav-link svg{width:18px; height:18px; flex-shrink:0;}
  .topbar-search{
    position:relative; display:flex; align-items:center;
  }
  .topbar-search svg{position:absolute; left:12px; opacity:.45; pointer-events:none;}
  .topbar-search input{
    width:210px; padding:8px 12px 8px 34px; border-radius:99px; border:1px solid var(--border);
    background:var(--surface); font-size:13px; color:var(--ink); outline:none; transition:border-color .15s, width .2s;
  }
  .topbar-search input:focus{border-color:var(--brand); width:250px;}
  .topbar-right{display:flex; align-items:center; gap:18px; font-size:14.5px; color:var(--muted);}
  .badge-user{
    display:flex; align-items:center; gap:8px;
    padding:6px 12px 6px 6px; border:1px solid var(--border); border-radius:99px; background:var(--surface);
  }
  .badge-user .avatar{
    width:24px; height:24px; border-radius:50%; background:var(--brand); color:#fff;
    font-size:12.5px; display:flex; align-items:center; justify-content:center; font-weight:700;
  }

  .breadcrumb{
    max-width:1180px; margin:0 auto; padding:18px 28px 0;
    display:flex; align-items:center; gap:8px; font-size:16px; color:var(--muted); flex-wrap:wrap;
  }
  .breadcrumb .crumb{cursor:pointer;}
  .breadcrumb .crumb:hover{color:var(--ink); text-decoration:underline;}
  .breadcrumb .sep{opacity:.5;}
  .breadcrumb .current{color:var(--ink); font-weight:600;}

  .container{max-width:1180px; margin:0 auto; padding:24px 28px 80px;}

  /* ===== Home hero ===== */
  .hero{padding:56px 0 40px; text-align:center;}
  .hero .eyebrow{
    display:inline-block; font-size:13.5px; letter-spacing:.18em; color:var(--muted);
    border:1px solid var(--border); padding:5px 14px; border-radius:99px; margin-bottom:18px; background:var(--surface);
  }
  .hero h1{font-size:38px; font-weight:600; margin-bottom:12px;}
  .hero p{color:var(--muted); font-size:15px; margin:0 auto; white-space:nowrap;}
  .search-row{
    max-width:480px; margin:28px auto 0; position:relative;
  }
  .search-row input{
    width:100%; padding:14px 18px 14px 44px; border-radius:99px; border:1px solid var(--border);
    background:var(--surface); font-size:15.5px; color:var(--ink); outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-row input:focus{border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft);}
  .search-row svg{position:absolute; left:16px; top:50%; transform:translateY(-50%); opacity:.45;}

  /* ===== Brand grid ===== */
  .section-label{
    display:flex; align-items:baseline; justify-content:space-between; margin:8px 0 18px;
  }
  .section-label h2{font-size:20px; font-weight:600;}
  .section-label span{font-size:13.5px; color:var(--muted);}

  .brand-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px;
  }
  .brand-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; position:relative; overflow:hidden; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .brand-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:transparent;}
  .brand-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--card-color,var(--brand));
  }
  .brand-card .bnum{
    font-family:'Roboto Mono',monospace; font-size:12.5px; color:var(--muted); margin-bottom:14px; display:block;
  }
  .brand-card h3{font-size:19px; margin-bottom:6px;}
  .brand-card .btag{font-size:14px; color:var(--card-color,var(--brand)); font-weight:500; margin-bottom:10px;}
  .brand-card p{font-size:14px; color:var(--muted); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .brand-card .go{
    margin-top:16px; display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500; color:var(--ink);
  }
  .brand-card .go svg{transition:transform .18s;}
  .brand-card:hover .go svg{transform:translateX(3px);}

  /* ===== Brand header band ===== */
  .brand-band{
    border-radius:var(--radius); padding:36px 32px; margin-bottom:28px; position:relative; overflow:hidden;
    background:var(--band-color,var(--brand)); color:#fff;
  }
  .brand-band::after{
    content:""; position:absolute; right:-40px; top:-40px; width:220px; height:220px; border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .brand-band .en{font-family:'Roboto Mono',monospace; font-size:12.5px; letter-spacing:.18em; opacity:.75; margin-bottom:10px;}
  .brand-band h1{font-size:30px; font-weight:600; margin-bottom:8px;}
  .brand-band p{font-size:15px; max-width:560px; opacity:.9;}
  .brand-links{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; position:relative; z-index:1;}
  .brand-links a{
    display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500; color:#fff;
    background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35); padding:7px 14px; border-radius:99px;
    transition:background .15s;
  }
  .brand-links a:hover{background:rgba(255,255,255,0.3);}

  /* ===== Module grid ===== */
  .module-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px;
  }
  .module-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s;
  }
  .module-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:transparent;}
  .module-card .micon{
    width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    background:var(--band-color,var(--brand)); color:#fff; margin-bottom:16px;
  }
  .module-card h4{font-size:16px; margin-bottom:6px;}
  .module-card p{font-size:14px; color:var(--muted); margin:0;}

  /* ===== Card / panel generic ===== */
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px;
    box-shadow:var(--shadow);
  }
  .panel + .panel{margin-top:16px;}

  /* ===== Product query ===== */
  .pq-tabs{
    display:flex; gap:8px; margin-bottom:22px; border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .pq-tab{
    background:none; border:none; padding:12px 4px; margin-right:20px; font-size:16px; font-weight:600; color:var(--muted);
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s, border-color .15s;
  }
  .pq-tab:hover{color:var(--ink);}
  .pq-tab.active{color:var(--band-color,var(--brand)); border-bottom-color:var(--band-color,var(--brand));}

  /* ===== Chart guide (Tab 2) ===== */
  .cg-section{margin-bottom:36px;}
  .cg-section-title{
    display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; margin-bottom:16px;
    padding-bottom:10px; border-bottom:1px solid var(--border);
  }
  .cg-section-title .cg-num{
    width:26px; height:26px; border-radius:50%; background:var(--band-color,var(--brand)); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14.5px; flex-shrink:0;
  }
  .cg-cat{margin-bottom:24px;}
  .cg-cat-name{
    display:inline-block; font-size:14px; font-weight:700; color:#fff; background:var(--band-color,var(--brand));
    padding:4px 14px; border-radius:99px; margin-bottom:12px;
  }
  .cg-table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-sm);}
  .cg-table{width:100%; border-collapse:collapse; font-size:14px; min-width:420px;}
  .cg-table th{
    text-align:left; background:var(--bg); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  .cg-table td{padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:top; line-height:1.6;}
  .cg-table tr:last-child td{border-bottom:none;}
  .cg-table .cg-nick{font-weight:700; color:var(--band-color,var(--brand));}
  .cg-note{font-size:13px; color:var(--muted); margin-top:8px; line-height:1.8;}
  .cg-flow{
    display:flex; flex-direction:column; gap:6px; margin:14px 0; padding:16px; background:var(--bg); border-radius:var(--radius-sm);
  }
  .cg-flow-item{font-size:14.5px; line-height:1.7;}
  .cg-flow-item b{color:var(--band-color,var(--brand));}
  .cg-warn{
    border:1px solid var(--border); border-left:3px solid var(--band-color,var(--brand)); border-radius:var(--radius-sm);
    padding:16px 18px; margin-bottom:16px; background:var(--surface);
  }
  .cg-warn h5{font-size:15px; margin:0 0 8px; font-weight:700;}
  .cg-warn ol, .cg-warn ul{margin:6px 0; padding-left:20px; font-size:14px; color:var(--ink); opacity:.9; line-height:1.7;}

  /* ===== Usage guide panel (獨立方格：全系列商品使用順序) ===== */
  .usage-guide-panel{margin-top:28px;}
  .ug-title{font-size:16px; font-weight:700; text-align:center; margin-bottom:20px;}
  .ug-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px;}
  .ug-care{border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px; background:var(--bg);}
  .ug-care-badge{
    display:inline-block; font-size:14px; font-weight:700; color:#fff; background:var(--band-color,var(--brand));
    padding:5px 14px; border-radius:99px; margin-bottom:12px;
  }
  .ug-care-desc{font-size:13.5px; color:var(--muted); line-height:1.7; margin:0 0 16px;}
  .ug-steps{display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .ug-step{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; text-align:center; flex:1; min-width:90px;
  }
  .ug-step-label{font-size:12px; font-weight:700; color:var(--band-color,var(--brand)); font-style:italic; margin-bottom:4px;}
  .ug-step-name{font-size:13.5px; font-weight:500; line-height:1.4;}
  .ug-arrow{color:var(--band-color,var(--brand)); opacity:1; flex-shrink:0;}
  .ug-arrow svg{width:20px; height:20px; stroke-width:2.5;}
  .ug-note{font-size:13px; color:var(--muted); margin-top:10px; text-align:right;}
  .cc-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px;}
  .cc-card{border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px; background:var(--bg);}
  .cc-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .cc-swatch{width:36px; height:36px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 3px var(--surface), 0 0 0 4px var(--border);}
  .cc-code{font-size:14px;}
  .cc-code b{font-size:15px;}
  .cc-purpose{font-size:12px; color:var(--band-color,var(--brand)); font-weight:600; margin-top:2px;}
  .cc-area{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .cc-desc{font-size:12.5px; color:var(--ink); opacity:.85; line-height:1.7; margin:0;}
  .ug-step-row{display:flex; align-items:flex-start; flex-wrap:wrap; gap:10px; justify-content:center;}
  .ug-stepcard{flex:1; min-width:150px; max-width:220px; text-align:center;}
  .ug-stepnum{font-size:15px; font-weight:800; color:var(--band-color,var(--brand)); margin-bottom:10px; letter-spacing:.03em;}
  .ug-stepname{
    display:inline-block; font-size:14px; font-weight:700; color:#fff; background:var(--band-color,var(--brand));
    padding:6px 14px; border-radius:8px; margin-bottom:10px; line-height:1.5;
  }
  .ug-stepfeature{font-size:13px; color:var(--ink); opacity:.75; margin-bottom:4px;}
  .ug-stepspec{font-size:12.5px; color:var(--muted);}
  .ug-arrow-h{align-self:center; margin-top:30px;}
  @media (max-width:640px){
    .ug-step-row{flex-direction:column; align-items:center;}
    .ug-arrow-h{transform:rotate(90deg); margin:4px 0;}
  }
  .pq-toolbar{
    display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center;
  }
  .pq-toolbar input{
    flex:1; min-width:220px; padding:12px 16px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:15px; outline:none;
  }
  .pq-toolbar input:focus{border-color:var(--band-color,var(--brand));}
  .pq-count{font-size:14px; color:var(--muted); white-space:nowrap;}

  .product-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;
  }
  .product-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px;
    display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .product-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:transparent;}
  .pc-nickname{
    display:inline-flex; align-self:flex-start; align-items:center; font-size:14.5px; font-weight:700; color:#fff;
    background:var(--band-color,var(--brand)); padding:4px 12px; border-radius:99px; margin-bottom:8px; letter-spacing:.02em;
  }
  .pc-eyebrow{font-size:13px; color:var(--muted); margin-bottom:2px;}
  .product-card .pname{font-size:17px; font-weight:700; line-height:1.4; color:var(--band-color,var(--brand));}
  .pc-highlight{font-size:14px; font-weight:500; color:var(--band-color,var(--brand)); opacity:.85; line-height:1.5;}
  .pc-desc{
    font-size:14px; color:var(--muted); line-height:1.7; margin-top:2px;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .product-card .pfoot{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .product-card .pprice{font-family:'Roboto Mono',monospace; font-size:15.5px; font-weight:600;}
  .product-card .pprice .strike{color:var(--muted); text-decoration:line-through; font-size:13px; margin-left:6px;}
  .product-card .psku{font-family:'Roboto Mono',monospace; font-size:12px; color:var(--muted); background:var(--bg); padding:3px 8px; border-radius:99px;}
  .tag-sample{
    display:inline-block; font-size:12px; color:#B89550; background:#B8955018; padding:2px 8px; border-radius:99px; width:fit-content;
  }
  .tag-soldout{
    display:inline-block; font-size:12px; color:#A85454; background:#A8545418; padding:2px 8px; border-radius:99px; width:fit-content;
  }
  .tag-discontinued{
    display:inline-block; font-size:12px; font-weight:600; color:#8A8578; background:#8A857822; padding:2px 8px; border-radius:99px; width:fit-content;
  }
  .product-card.is-discontinued{
    background:var(--bg); opacity:.72; filter:grayscale(45%);
  }
  .product-card.is-discontinued:hover{opacity:.92; filter:grayscale(20%);}
  .product-card.is-discontinued .pc-nickname{background:#8A8578;}
  .pd-panel.is-discontinued{background:var(--bg);}
  .discontinued-label h2{color:var(--muted);}
  .discontinued-label{
    margin-top:32px; padding-top:20px; border-top:1px dashed var(--border);
  }
  .pd-nickname{margin-bottom:10px;}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted); font-size:15px;
  }
  .pmore{
    display:flex; align-items:center; gap:5px; font-size:13px; font-weight:500; color:var(--band-color,var(--brand)); margin-top:2px;
  }

  /* ===== Product detail ===== */
  .pd-back{
    display:inline-flex; align-items:center; gap:7px; font-size:16px; font-weight:700; color:var(--band-color,var(--brand));
    cursor:pointer; margin-bottom:18px; padding:8px 16px 8px 10px; border-radius:99px; background:var(--surface);
    border:1px solid var(--border); box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s;
  }
  .pd-back:hover{transform:translateX(-2px); box-shadow:var(--shadow-lg);}
  .pd-back svg{width:18px; height:18px;}
  .pd-panel{padding:30px;}
  .pd-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;
    padding-bottom:22px; margin-bottom:6px; border-bottom:1px solid var(--border);
  }
  .pd-name{font-size:22px; margin:6px 0 4px;}
  .pd-spec{font-size:14px; color:var(--muted);}
  .pd-price-box{text-align:right;}
  .pd-price{font-family:'Roboto Mono',monospace; font-size:20px; font-weight:600; margin-bottom:10px;}
  .pd-buy{display:inline-block; background:var(--band-color,var(--brand)); white-space:nowrap;}
  .pd-list{padding-left:20px; margin:6px 0; display:flex; flex-direction:column; gap:6px;}
  .pd-list li{font-size:15px; color:var(--ink); opacity:.9; line-height:1.6;}

  /* ===== Q&A ===== */
  .qa-list{display:flex; flex-direction:column; gap:14px;}
  .qa-item{border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px 18px;}
  .qa-q{font-size:15px; font-weight:600; margin-bottom:8px; display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap;}
  .qa-source{
    margin-left:auto; font-size:11px; font-weight:500; color:var(--muted); background:var(--bg);
    padding:2px 10px; border-radius:99px; white-space:nowrap;
  }
  .qa-q .qmark{color:var(--band-color,var(--brand)); flex-shrink:0;}
  .qa-a{font-size:14.5px; color:var(--muted); line-height:1.7; padding-left:22px;}
  .qa-category{
    font-size:10.5px; font-weight:700; color:var(--band-color,var(--brand)); background:var(--band-color,var(--brand))18;
    padding:2px 9px; border-radius:99px; flex-shrink:0;
  }
  .qa-situation{
    font-size:10.5px; font-weight:600; color:var(--muted); background:var(--bg);
    padding:2px 9px; border-radius:99px; flex-shrink:0; border:1px solid var(--border);
  }
  .internal-note-toggle{
    display:inline-flex; align-items:center; gap:5px; margin:10px 0 0 22px; font-size:12.5px; font-weight:600;
    color:#B8863B; cursor:pointer; user-select:none; width:fit-content;

      {q:'白天可以使用抗痘系列嗎？', a:'白天不建議使用 5% 杏仁酸精華液，避免因肌膚較敏感的關係造成不適；但可以單獨使用 5% 菸鹼醯胺乳液達到保濕效果，並搭配有效防曬。'},
      {q:'敏感肌膚想改善痘痘，可以使用抗痘系列嗎？', a:'敏感肌可從較低頻率開始使用，並進行局部測試；若無刺激反應，則可逐步增加使用頻率。'},
      {q:'系列是否為全素？', a:'是的，品牌全系列產品皆為純素，可安心使用。'},
      {q:'孕婦可以使用抗痘系列嗎？', a:'5% 菸鹼醯胺乳液對孕婦安全，但建議孕婦在使用 5% 杏仁酸精華液前諮詢醫生。'},
      {q:'抗痘系列需要冷藏保存嗎？', a:'不建議冷藏，因為低溫可能會改變活性成分的穩定性，降低效果；此外，溫度變化會影響產品質地。最佳儲存方式是放在陰涼乾燥處，避免陽光直射。'},
      {q:'抗痘系列可以和其他產品一起使用嗎？', a:'可以，但建議避免與高濃度酸類或維他命C產品同時使用，以減少皮膚刺激；建議油性肌膚、敏感性肌膚盡量減少護膚步驟，為肌膚減輕負擔。'},
      {q:'擦完精華再擦乳液，結果臉上都有屑屑，要怎麼改善？', a:'少數人肌膚吸收程度不同，會需要兩支產品間隔較長時間，或是後續擦乳液時不需全臉擦拭，只需要手心擠一點、雙手抹開後按壓在臉上即可。'},
      {q:'請問超能C20%煥白解方精華，顏色變深是正常的嗎？', a:'因我們的維他命C是高濃度精華，且盡量不添加容易過敏的化合物、溶劑，所以顏色上會隨著時間出產後漸漸變深，產品資訊的照片因為是生產後馬上拍攝，所以您收到後顏色上的變化是正常的；產品盒裝、瓶身上皆有開罐符號 6 個月，原廠製造建議以「開封後」計算 6 個月內使用完畢，避免維他命C效果不如預期。'},
      {q:'如果產品顏色變深了，還能使用嗎？', a:'如果產品顏色變成深橘色或褐色，是純維他命C的正常特性，建議在開封後的三個月內使用完畢；產品開封六個月以後如未使用完，建議使用新品。'},
      {q:'請問如果想美白跟保濕的話，煥白的修護精華可以一起使用嗎？', a:'若想要美白跟保濕功能兼顧的話，建議可以美白精華＋修護乳液，修護乳液是六支產品保濕效果最好的。'},
      {q:'為什麼乳液的維他命C濃度比較低？', a:'乳液的設計是為了日常舒適保濕，同時帶來溫和的抗氧化功效，避免過高濃度可能引起的刺激感，適合搭配精華液使用。'},
      {q:'煥白系列什麼時候使用效果最好？', a:'建議早上或晚上清潔後使用。早上使用時，請記得搭配防曬產品以保護皮膚。'},
      {q:'煥白系列產品需要冷藏保存嗎？', a:'不需要，但建議存放於陰涼乾燥處，避免陽光直射，以維持維他命C的穩定性。'},
      {q:'20%純維他命C精華液適合每天使用嗎？', a:'如果是第一次接觸高濃度維他命C產品，建議從每週 2–3 次開始，待皮膚適應後可逐漸增加至每天使用；但如果皮膚感到乾燥或刺激，建議減少使用頻率。'},
      {q:'20%純維他命C精華液中含有酒精，會對皮膚造成影響嗎？', a:'精華液中的酒精主要用於幫助成分滲透，提升產品吸收效果，並增加清爽感。配方中添加的酒精濃度經過調配，確保在大多數情況下對肌膚安全；然而，如果您的皮膚對酒精特別敏感，建議在使用前進行局部測試，確認無不適反應後再使用。'},

      {q:'怎麼選適合自己的色號？', a:'選擇最適合的色號主要參考兩個關鍵點：\n一、判斷膚色基調——冷色調（血管偏藍紫色）適合帶粉色調（Pink/Rose）的色號，能讓氣色更紅潤；暖色調（血管偏橄欖綠色）適合帶黃色調（Yellow/Golden）的色號，能中和泛紅使妝容更自然；中性調的膚色大部分色號都能適用。\n二、決定想要的妝效——追求自然可選擇與頸部膚色最接近的色號；追求提亮可選擇比膚色白半階到一階的色號。\n小提醒：遮瑕膏的色號建議比粉底液深半階來遮蓋痘印或瑕疵；若用於眼下提亮，則可選淺半階。'},

      {q:'黑眼圈有點紅紅紫紫的，建議用哪個色號遮黑眼圈呢？', a:'紅紫色調是相當常見的血液循環不佳型黑眼圈，針對這種帶有紅色和紫色混合的色調，建議使用 2N 這個色號。'},

    qa:[
      {q:'什麼是穀胱甘肽？為什麼可以美白？', a:'穀胱甘肽是韓國「白玉針」的核心成分，因藝人施打而聲名大噪，在韓國也被暱稱為「IU 針」。它有助於改善膚色暗沉不均、延緩肌膚老化、改善容易色素沉澱的問題，除了注射療程外，也常見於口服美白營養品與保養品配方中。'},
      {q:"請問Angel's Liquid的產品孕婦可以使用嗎？", a:'雖然有經過低刺激性測試，但韓國並未特別針對孕婦族群做過安全性驗證。由於孕婦肌膚較敏感，會建議先諮詢專業醫師或是先在局部做測試後再評估。'},
      {q:"請問臉上有顆粒感痘痘也可以使用Angel's Liquid的產品嗎？如果有正在發炎的痘痘可以使用嗎？", a:'產品中未含有任何會誘發痘痘生長的成分，任何肌膚都可以安心使用。不過，如果是發炎中的痘痘較為嚴重或有紅腫疼痛的情況，我們還是會比較建議您先諮詢皮膚科醫師的專業建議，以確保肌膚能得到適合的照顧與治療。'},
      {q:"請問Angel's Liquid的產品為什麼味道較濃烈，原因是什麼？", a:'本產品特別添加韓國最高濃度的穀胱甘肽，因為高純度原料本身會帶有些許天然氣味。品牌堅持不以香精掩蓋，保留成分最真實、最有效的狀態，讓您能安心享受高效保養。'},
      {q:"請問Angel's Liquid的商品適用微針美容儀操作嗎？", a:"Angel's Liquid 的商品絕對可以搭配微針美容儀操作！並且我們非常推薦將產品搭配微針美容儀使用，因為這樣做可以讓產品的功效加乘放大，效果會更好！"},
      {q:"請問Angel's Liquid的產品寶寶不小心沾到有關係嗎？怕擦完吸收後抱著寶寶多多少少會沾到一點", a:"Angel's Liquid 全產品通過低刺激測試，但該測試是以「成年人肌膚」為標準。事實上，嬰幼兒的皮膚屏障比成年人薄約二分之一，任何成年人使用的保養品，對嬰幼兒來說濃度可能都過高。因此建議：1. 避免直接塗抹到：雖然成分溫和，但是給成年人的任何保養品都不建議幼兒直接觸碰。2. 日常接觸無虞：媽咪保養後的日常抱抱、親吻通常沒有大礙。但為了給寶寶最嚴謹的保護，我們會建議在塗抹任何保養品後，約等待 5-10 分鐘，待成分完全被皮膚吸收乾爽後，再與孩子進行親密互動，這樣最為安全喔！"},
      {q:"請問Angel's Liquid的產品酒糟肌也可以用嗎？", a:"Angel's Liquid 全系列產品皆通過皮膚低刺激測試，主打無酒精、溫和配方，旨在穩定肌膚屏障，讓敏弱肌也能安心提亮。但是由於酒糟肌的皮膚受器較為敏感，在使用高活性、高濃度成分時，仍需要留意，本系列產品含高濃度菸鹼醯胺以修復屏障，但對部分極度脆弱的酒糟肌，初期可能產生短暫的溫熱感或微紅；系列中含有多種植物精華，雖然天然，但對於處於發炎爆發期的酒糟肌，仍可能因活性成分過度滲透而造成刺激。因酒糟肌情況較為特殊，我們的產品濃度非常高，建議如果您的肌膚正處於紅腫熱痛的發作期，請先暫停任何美白產品，以醫師處方為主；若在穩定期，建議先在耳後或局部測試 3 天，確定皮膚適應後再全臉使用喔！使用前也建議諮詢醫師！因為濃度比較高加上酒糟肌耐受度比較低的關係真的要多注意！"},
      {q:"請問Angel's Liquid有含酸類嗎？", a:'這系列的配方非常純粹，主要核心成分為高純度穀胱甘肽（Glutathione）與菸鹼醯胺（維他命B3），主打深度亮白、修護與長效保濕，並未添加常見的煥膚酸類（如果酸AHA、水楊酸BHA或A酸相關成分），因此質地相對溫和，也通過了韓國嚴格的低刺激測試。不過，考量到每個人的膚質狀況不同，若近期有安排美容做臉或相關醫美療程，還是建議在使用前先諮詢美容師或醫師，確保產品與做的療程不衝突，才能達到最好的效果喔！也比較安心。'},
      {q:"請問Angel's Liquid的產品去痘痘可以用嗎？", a:'這款產品在定位上，其實是屬於高濃度的亮白與修護精華，並非專門針對痘痘設計的，也沒有酸類成分。很多顧客回饋痘痘不見了，其實是因為穀胱甘肽是極強的抗氧化劑，能穩定肌膚的發炎反應，紅腫的發炎狀態就更容易平復。另外成分中的 5% 菸鹼醯胺（維他命B3）、腺苷，對於油脂分泌旺盛導致的粉刺和發炎痘，修復改善效果非常明顯。當您皮膚的基底環境變好了，痘痘自然就待不住了！這也是為什麼很多有痘痘困擾的顧客，用完後都驚喜地發現皮膚變得很穩定的原因。'},
      {q:"請問Angel's Liquid的產品可以搭配酸類使用嗎？", a:'理論上搭配低濃度酸類產品是沒問題的。只要避免同時使用高濃度酸類、高濃度維他命C，並避免過度去角質，並且間隔 5~10 分鐘讓皮膚表面的 pH 值稍微恢復再上即可。由於本產品的菸鹼醯胺濃度較高，建議搭配其他產品時，先靜候 5 分鐘待肌膚吸收，能有效避免成分衝突；若您的肌膚較為敏感，因本產品濃度已經很高，則不建議再搭配中高濃度的酸類產品使用。'},

          {q:'染色洗髮精染色維持與效果？', a:'一般來說染色效果依個人使用方式、時長與髮質有些許差異。在頭髮上停留 5–10 分鐘，染色大約可以維持 2 至 4 週；達到理想髮色後，不需要天天使用，可以改為需補色時每週使用 1–2 次，或者與一般洗髮精交替使用，以維持顏色不褪去。'},
          {q:'染色洗髮精是濕髮還是乾髮使用／上不了色怎麼辦？', a:'關於濕髮上色效果不佳，建議可以先嘗試「乾髮使用」的方式：由於每個人的髮質粗細、受損程度以及白髮量都不同，這些因素會影響色素附著的效果。SMIB 染色洗髮精與市面上的傳統染髮劑是完全不同的，不是使用傳統染髮劑中刺激性高的化學成分（如 PPD）來打開毛鱗片並將色素強行滲入髮芯，而是利用天然、溫和的植物性色素，搭配獨家的專利鉑金技術，在洗髮的過程中，讓色素以更細微、溫和的方式附著在髮絲的表層。建議可以先嘗試乾髮時使用：直接將洗髮精像染髮劑一樣塗抹在白髮較多的部位，並停留約 5–10 分鐘（第一次使用可停留久一點），再加水起泡沖洗，這樣可以讓色素在髮絲上停留更長時間，有效提高上色的飽和度與效果。'},

          {q:'請問如果是偏乾燥的易癢過敏頭皮也適合染色洗髮精嗎？', a:'這款 SMIB 洗髮精在韓國市場上，其實就是針對調理頭皮環境、維持頭皮健康這個方向去研發的喔！韓國團隊是基於專業的頭皮護理理念進行研發，目前許多有頭皮相關困擾的顧客，使用後都給予了很不錯的反饋。綜合產品的研發定位和顧客的真實回饋，這款洗護組非常適合注重頭皮健康、想改善頭皮困擾的族群！很推薦可以給它一個嘗試的機會喔～'},
          {q:'SMIB 可以染鬢角、鬍子、眉毛之類的部位嗎？', a:'可以染色在鬢角、鬍子、眉毛的部分～不過需要注意不要用到眼睛，一定會痛；其他肌膚部位是不會有染色現象，只須注意手指甲可能會有，因為指甲由蛋白質組成與頭髮的成分相近，較易染色，建議有碰到手部盡快沖洗掉即可。以原廠的數據來看，引發問題肌膚的機率不到 2%，觀察這 2% 的人大部分是特別敏感肌膚的人群，可以建議先在局部測試後再使用。'},
          {q:'染劑弄到額頭周圍皮膚怎麼洗？', a:'若不慎沾染到額頭皮膚，請不用擔心，通常都可以清除。建議依照以下步驟溫和處理：立即用洗面乳或肥皂的泡沫，搭配溫水輕輕搓洗染色區域；如果單純清潔無效，可使用卸妝油或卸妝膏輕輕按摩染劑處約 30 秒，再用溫水沖洗；若仍有殘留，可使用少量酒精棉片或含有酒精的化妝水輕輕擦拭（使用後務必清水沖淨並加強保濕）。整個過程請溫和處理，切勿用力搓洗，以免皮膚受傷。'},

          {q:'使用染色洗髮精一定要帶手套嗎？', a:'因為指甲的成分也是蛋白質，跟頭髮一樣較易上色。動作快一點洗掉就沒事，但每個人的體溫和皮膚狀況不一樣，如果真的很擔心怕指甲變色，建議還是戴上手套比較安心喔！'},
          {q:'使用SMIB森密染色洗髮精後，去一般髮廊染髮會卡色嗎或染不上去嗎？', a:'SMIB森密染色洗髮精採用的是「物理包膜上色技術」，利用正負電荷相吸原理，讓天然可可粉包裹在髮絲外層。若在使用產品後，立即進行一般常規染髮，可能會因個人毛髮況關係受到些許影響。建議在停止使用大約 7–10 天後，即可正常進行其他常規染髮或使用其他染色產品。'},
          {q:'是一般俗稱的泡沫染嗎？', a:'SMIB 染色洗髮精與傳統染劑不同，傳統染髮是透過化學成分（如PPD（對苯二胺）、阿摩尼亞或雙氧水）「強行滲透」髮芯，容易導致過敏；而我們採用的是「物理包膜上色技術」。簡單來說，它就像為頭髮「穿上彩色保護衣」：利用正負電荷相吸原理，讓天然可可粉包裹在髮絲外層，不破壞毛鱗片，所以不傷髮質。此外，產品還添加了專利乳酸菌，在洗髮時能同步修護頭皮屏障，這也是為什麼能洗染完不乾澀的原因！'},
          {q:'如果可以染頭髮又可以洗頭的話，為什麼可以接觸到頭皮？原理是什麼？', a:'SMIB 染色洗髮精與傳統染劑不同，傳統染髮是透過化學成分（如 PPD、阿摩尼亞或雙氧水）「強行滲透」髮芯，容易導致過敏；而 SMIB 採用的是「物理包膜上色技術」，利用正負電荷相吸原理，讓天然可可粉包裹在髮絲外層，不破壞毛鱗片，所以不傷髮質。此外，產品還添加了專利乳酸菌，在洗髮時能同步修復頭皮屏障，這也是為什麼能越洗越亮、越洗越順的原因！'},
          {q:'建議染色洗髮精先乾上再用自己的洗髮精，還是先用自己的洗髮精再上染色洗髮精呢？', a:'想要「上色效果更好」：建議先乾上，在頭髮乾的狀態下，將補色洗髮精均勻塗抹在白髮較多或想補色的區塊，停留約 5–10 分鐘，讓色素有時間附著，再加水搓揉起泡後沖掉，如果覺得洗淨力不夠，之後再用一般的洗髮精洗一次。想要「日常維護/低調自然」：建議先洗再上，先用一般的洗髮精將頭皮的油脂、髒污與造型品洗掉，再將頭髮稍微壓乾（不滴水狀態），塗抹染色洗髮精停留 3–5 分鐘後沖洗，這樣色素比較不會被油脂阻隔，附著度會更均勻。'},

    qa:[
      {q:'敏弱肌膚可以使用嗎？', a:'如肌膚容易有敏弱問題，使用產品前都建議先小範圍做測試，待確認肌膚無不適反應，再擴大使用範圍。「2% 維他命A醇衍生物 + GABA」與「30%果酸 + 4%杏仁酸」不建議敏弱肌使用。如肌膚正值不穩定、有不適感，建議先諮詢皮膚科醫生，會比較安全。'},
      {q:'孕婦、哺乳期可以使用嗎？', a:'孕婦不建議使用的商品是「30%果酸 + 4%杏仁酸」、「2% 維他命A醇衍生物 + GABA」、「3%杏仁酸+2%酒石酸」、「Revi抗皺A醇眼部精華」。全品項商品哺乳期沒有使用限制，如仍有疑慮，建議先諮詢醫生後再評估使用。'},
      {q:'有沒有不建議囤放的商品？', a:'以下商品不建議囤放：13%杜鵑花酸抗痘精華乳（小橘管）、2%水楊酸粉刺調理精華（消消瓶）、2%傳明酸淡斑美白精華（修修瓶）、0.05%維他命A醛毛孔緊緻精華（柔膚瓶），建議購買後盡快開封使用完畢。'},
      {q:'產品可以怎麼組合搭配使用？', a:'建議順序（不考慮膚質與是否可互搭）：臉部清潔 → 眼部精華（Brio 或 Revi）→ 戰痘瓶（局部痘痘處）→ 發光瓶 → 溫和杏仁酸精華 → 10B修復瓶 → 溫和淡斑精華 → 水水瓶 → 5B緊緻瓶 → 乖乖瓶 → 撫紋瓶 → 2%維他命A醇衍生物+GABA → 柔膚瓶 → 爆水瓶 → 修修瓶 → 小橘管 → 消消瓶 → 乳液或乳霜。'},
      {q:'請問產品有添加香精、酒精或色素嗎？', a:'BFFECT的產品皆未添加香精、酒精與色素。'},
      {q:'產品有添加類固醇嗎？', a:'BFFECT產品都無添加類固醇。'},
      {q:'產品有添加防腐劑嗎？', a:'BFFECT產品都有添加防腐劑。'},
      {q:'產品保存期限/有效期限多久？', a:'官網/專屬賣場販售的產品保存期限至少有一年以上（除了有標示福利品的產品），實際保存期限可參閱產品外盒與產品瓶底部，開封後產品都建議盡快使用完畢。'},
      {q:'請問雷射後，可使用哪些產品？', a:'如果是沒有明顯傷口的保養型雷射，施打後是可以使用「【水水瓶】2% 多重玻尿酸 + 1% Na-PCA」「【爆水瓶】2%多重玻尿酸 + 1%寡糖胺基酸」、「【乖乖瓶】Calmer 高效修護精華」，但因每個人施打雷射後的肌膚狀況不同，建議使用前可以先小範圍的局部做測試；但如果是有明顯傷口的雷射，建議要先諮詢醫師，或是待恢復期後，再進行使用。'},
      {q:'請問孕婦可以使用嗎？', a:'目前孕婦期不建議使用「30%果酸 + 4%杏仁酸」。孕婦不建議使用的產品，商品頁的【注意事項】中皆有說明，若還是有疑慮，建議可以先諮詢醫生後再評估使用。'},
      {q:'請問哺乳期可以使用嗎？', a:'BFFECT商品在哺乳期沒有限制使用，如還是有疑慮，建議可以先諮詢醫生後再評估使用。'},
      {q:'請問10% 維他命B3 + 2% 淡紋四胜肽的瓶口為何會出現白色粉末？', a:'因Niacinamide濃度較高，如使用時有精華液殘留於瓶身/瓶口，當精華液乾燥後，可能會有白色結晶粉末殘留於瓶口，此為正常現象，官網的商品頁面也有註明此為正常現象。'},
      {q:'請問Kira塗起來有溫熱感是正常的嗎？', a:'由於【發光瓶】Kira 維他命C發光精華此款產品為無水配方，產品所使用之部分配方塗抹於肌膚上就會帶有溫熱感，屬於正常現象。'},
      {q:'請問玻尿酸會跟我的乳液起屑，這樣要怎麼改善？', a:'含有大分子玻尿酸的玻尿酸保濕精華有可能會和乳液或乳霜產生起屑現象，但因每款玻尿酸的配方與比例不同，所以需要實際使用才能確認是否會和原先的產品有此現象。建議可試試看以下方式做調整：降低玻尿酸精華的用量，建議可先從一滴紅豆大小開始使用，使用時建議用按壓的方式，不要揉搓，待肌膚都吸收後，再塗抹後續產品，觀察是否有改善。'},
      {q:'請問玻尿酸會跟我的防曬（或彩妝）起屑，這樣要怎麼改善？', a:'含有大分子玻尿酸的玻尿酸保濕精華有可能會和防曬或彩妝產生起屑現象，但因每款玻尿酸的配方與比例不同，所以需要實際使用才能確認是否會和原先的產品有此現象。建議可試試看以下方式做調整：先降低玻尿酸精華的用量，並於塗抹後，加一道乳液或是乳狀產品，後續再上防曬或是彩妝，再觀察是否有改善。'},
      {q:'請問有粉刺問題，要購買哪一款產品？', a:'粉刺問題可視粉刺類型及肌膚狀況，選用適合的產品。若有粉刺、毛孔堵塞等困擾，可選用「30%果酸＋4%杏仁酸」，幫助代謝老廢角質、改善肌膚粗糙及毛孔堵塞問題。因酸類產品具有一定刺激性，建議依自身膚況適量使用，並避免同時搭配多種酸類產品，以免造成肌膚刺激。'},
      {q:'請問想要美白，建議使用哪款產品？', a:'若想改善膚色暗沉、提亮膚色或淡化肌膚瑕疵，可以參考「【修修瓶】2%傳明酸美白精華」：可全臉或局部瑕疵使用、適合各種膚質、含酸類成分質地較保濕、適合想要美白同時兼具保濕需求的人，敏感性肌膚建議先於小範圍局部測試。美白保養建議持續使用並搭配日間防曬，才能更好地維持肌膚明亮狀態。'},
      {q:'請問如果有痘痘，要用什麼產品改善？', a:'如果肌膚容易敏感或是不敢使用含酸類成分的抗痘產品，建議可選擇「Acno 敏感肌抗痘精華」，無添加酸類成分，可於全臉與痘痘處使用。如果肌膚不容易敏感，可選擇「【小橘管】13%杜鵑花酸抗痘精華乳」，可於全臉與痘痘處使用，有調理痘痘、改善粉刺、明亮肌膚、細緻毛孔等效果。'},
      {q:'我有痘疤問題，請問要用甚麼產品改善？', a:'需先確認痘疤是屬於色素沉澱型痘印，還是有明顯凹凸不平的痘疤，不同類型的痘疤，適合的改善方式會有所不同。若為色素沉澱型痘印，可以參考「【修修瓶】2%傳明酸美白精華」改善；若為凹凸型痘疤，通常較難單靠保養品改善，建議可以諮詢皮膚科醫師，由醫師依照痘疤的類型及程度評估適合的改善方式。'},
      {q:'請問如果有斑點/肝斑問題，要用什麼產品改善？', a:'若有斑點、膚色不均或色素沉澱的困擾，可以參考「【修修瓶】2%傳明酸美白精華」：可全臉或局部瑕疵使用、適合各種膚質、含酸類成分質地較保濕。若是肝斑問題，因肝斑成因及狀況較複雜，建議可先諮詢皮膚科醫師確認膚況，再選擇適合的保養方式；日常也建議搭配防曬，避免紫外線刺激造成色素沉澱。'},
      {q:'請問眼袋要怎麼改善？', a:'因眼袋較難透過保養品做改善，建議可諮詢專業皮膚科醫師。'},
      {q:'無法順利按壓內容物出來怎麼辦？', a:'開封首次使用可能需要多次按壓，排出壓力。如擔心產品擠出可以將用手接住開口的部分；但因手指施力可能較不足，導致無法順利按壓，可以將產品置於桌子上，用掌心由上往下垂直 90 度壓到底，待成功可以按壓出產品後，可以使用普通方式按壓即可。'},
      {q:'需要搭配乳液和化妝水使用嗎？', a:'BFFECT的產品都可以在臉部清潔後直接使用，乳液和化妝水可以視個人肌膚需求自行搭配保養。'},
      {q:'30%煥膚瓶注意事項是什麼？', a:'【30%煥膚瓶】30%果酸 + 4%杏仁酸每周最多建議僅使用一次，並建議於晚上使用，每次使用時間不超過十分鐘，並以溫水沖洗乾淨（如感到肌膚明顯不適，可提前清洗）。當天使用後，建議做好肌膚保濕即可，非單純保濕功效的產品，隔天再進行使用，使用的前後 7 天內，也要避免使用去角質與其它含有酸類與維生素A類成分之商品。'},
      {q:'客戶有吃A酸，那保養品10B仍可以使用嗎？', a:'口服A酸是可以搭配使用 10%B3 的，因為口服A酸後肌膚應該會比較乾燥，建議加強做好保濕（水水瓶或爆水瓶），10B 的用量及次數正常使用即可。口服A酸期間不塗抹A酸藥膏時，不建議使用維他命A全系列和酸類產品，因為口服A酸後肌膚會比較乾燥，做好保濕會是更重要的保養步驟；10%B3 比較清爽，後續建議要加強一下保濕。'},
      {q:'請問2%傳明酸淡斑美白精華為何使用到最後時無法再按壓出？', a:'因為所使用的瓶器是壓頭瓶不是真空瓶，所以底部無法用到最後，建議把瓶子倒過來放，讓內料流到瓶口附近，再把蓋子轉開用倒的，或是也可以轉動一下吸管，看看是否能吸到其他底部的料，通常用倒的效果比較好。所有的按壓瓶都會有這個情況，優先建議將瓶子倒過來放，讓內料流到瓶口附近，再把蓋子轉開用倒的。'},
      {q:'有顧客購買水楊酸，反應有白色一點一點狀況，請問原因是？', a:'此現象為溫度影響，而產生水楊酸的結晶，結晶於塗抹後就會溶化掉，可以正常使用。'},
      {q:'我眼周圍容易長脂肪球，會比較建議哪個產品？', a:'眼周較為常見的顆粒可能為粟粒腫，與眼周乾燥、循環代謝不良有關，或是肉芽與個人遺傳、體質、新陳代謝有關，和保養、彩妝品成分並沒有太大的關聯性。建議可至皮膚科諮詢醫師，成因不同治療方式亦不同；當眼周問題改善後，建議可以使用 Brio 高效眼部胜肽精華液來保養眼周。'},
      {q:'我有購買10B、水水、發光瓶，這陣子擦下來發現臉部會乾癢，若再加上發光瓶臉頰會有刺痛，請問是哪瓶不適合我嗎？', a:'臉部會乾癢脫屑，極有可能是角質層含水量偏低所以會乾癢脫屑，以及肌膚屏障受損，產生細小的傷口，導致擦發光瓶時會有刺痛產生。因適逢季節交換，肌膚通常也較容易有狀況，建議加強保濕，水水瓶早晚要加強，若一次不夠可擦 2 次，10B修復瓶除了改善毛孔粗大外，也可以修護肌膚，提升肌膚對環境傷害的保護力，待肌膚水分充足及屏障修復後，膚況穩定再來使用發光瓶。若想快速修復肌膚屏障、提升肌膚免疫力，會建議加上乖乖瓶，可以舒緩因乾燥引起肌膚之泛紅、乾癢、敏感、脫屑，修護肌膚、強化肌膚保護力、增加肌膚保濕度、防止肌膚乾燥；或是想加強保濕也可以參考爆水瓶，短時間可大量提升皮膚含水量，水水瓶則是屬於較清爽的保濕。'},
      {q:'客人詢問Brio 高效眼部胜肽精華的Haloxyl™、SYN®-COLL™、EYELISS™這3個成分的胜肽來源是動物、植物還是合成的？', a:'這三個是植物＋合成的複方原料。'},
      {q:'我是Vegan吃素多年，請問你們的商品是純植物性製作的嗎？', a:'BFFECT商品除了【30%煥膚瓶】30% 果酸 + 4% 杏仁酸及【柔膚瓶】0.05%維他命A醛毛孔緊緻精華為非純素外，其餘商品為純素，可以點進每支精華液並從更多產品資訊點入，每支商品是否為純素均在官網有明確標示。BF全系列商品均無動物實驗。'},

      {q:'客戶詢問BFFECT【10B修復瓶】成分Niacinamide菸鹼醯胺是使用純的菸鹼醯胺粉嗎？', a:'是的。'},
      {q:'【修修瓶】2%傳明酸淡斑美白精華，成分維他命B3的濃度是多少呢？', a:'產品的成分都有依法完整標示在包裝或是官網上，不過因為配方比例屬於品牌研發的核心技術，所以不會對外公開每一項的精確濃度，這也是產品差異化的核心。若有相關肌膚使用問題，歡迎提供給我們為您服務。'},
      {q:'客戶一開始使用10B肌膚臉頰時會有刺痛感，避開眼周使用，連續三天之後就出現眼睛紅癢乾的症狀，請問原因是？', a:'這款產品中的維他命B3濃度較高，少數眼周肌膚本身較薄、較敏感者，會較容易感受到不適。這類型肌膚建議可先以每週 2–3 次的頻率使用、用量減少，待肌膚適應後，再視情況調整使用頻率和用量；若目前肌膚處於紅腫狀態，建議先暫停使用產品。'},
      {q:'客人一週使用三次【30%煥膚瓶】，後續有使用水水瓶保濕，但隔天覺得皮膚很油，原因是？', a:'30% 果酸煥膚精華主要是幫忙代謝肌膚角質、通暢毛孔、改善粉刺問題，因一週使用 3 次，角質過度剝除皮膚覺得「缺水」於是啟動保護機制、分泌更多油脂鎖水，所以隔天會覺得皮膚變油。此為高濃度複合型果酸，建議一週最多使用一次，停留時間不超過十分鐘，使用的前後 7 天內，避免使用去角質與其它含有酸類與維生素A類成分之商品；果酸換膚後除了保濕精華以外，可以再加上清爽的乳液來鎖水，油脂就會慢慢穩定下來。'},

function logSearchToGoogleForm({ brand, category, actionType, productName, csCategory }){
  const formActionUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfEs3wX3mEmUie95Klyc-TCHf9DBoN0srs3FcF6_BBbc5a_aw/formResponse';
  const formData = new FormData();
  if (brand)       formData.append('entry.515793904', brand);       // 查詢品牌
  if (category)    formData.append('entry.442596539', category);    // 查詢類別
  if (actionType) {
    if (category === '產品知識庫') {
      formData.append('entry.1172570504', actionType);              // 產品使用的查詢方式
    } else {
      formData.append('entry.1158574742', actionType);              // 客服使用的查詢方式
    }
  }
  if (productName) formData.append('entry.1451433513', productName); // 查詢產品名稱
  if (csCategory)  formData.append('entry.1369614496', csCategory);  // 客服查詢分類

  fetch(formActionUrl, { method: 'POST', mode: 'no-cors', body: formData })
    .catch(() => console.log('紀錄已於背景發送'));
}

function updateNavActive(id){
  ['navHome','navEdu','navKB'].forEach(nid=>{
    const el = document.getElementById(nid);
    if(el) el.classList.toggle('active', nid===id);
  });
}

function renderBreadcrumb(){
  if(state.view==='kb'){
    crumbEl.innerHTML = `<span class="crumb" onclick="goHome()">首頁</span><span class="sep">/</span><span class="current">客服知識庫</span>`;
    return;
  }
  let parts = [`<span class="crumb" onclick="goHome()">首頁</span>`];
  if(state.brandId){
    const b = getBrand(state.brandId);
    parts.push(`<span class="sep">/</span>`);
    parts.push(state.moduleId
      ? `<span class="crumb" onclick="goBrand('${b.id}')">${esc(b.name)}</span>`
      : `<span class="current">${esc(b.name)}</span>`);
  }
  if(state.moduleId){
    const m = getModule(state.moduleId);
    parts.push(`<span class="sep">/</span>`);
    parts.push(`<span class="current">${esc(m.name)}</span>`);
  }
  crumbEl.innerHTML = parts.join('');
}

function render(){
  renderBreadcrumb();
  if(state.view==='kb'){ updateNavActive('navKB'); renderKnowledgeBasePage(); return; }
  if(!state.brandId){ updateNavActive('navHome'); renderHome(); return; }
  updateNavActive(null);
  if(!state.moduleId){ renderBrandPage(getBrand(state.brandId)); return; }
  renderModulePage(getBrand(state.brandId), getModule(state.moduleId));
}

function findGlobalAnswer(query){
  let best = { score:0, data:null };
  collectGlobalQA().forEach(item=>{
    const s = matchScore(query, item.q) + qaIntentBoost(query, item.q) + keywordBoost(query, item);
    if(s > best.score) best = { score:s, data:item };
  });
  if(best.score < 0.24 || !best.data) return null;
  let out = esc(best.data.a).replace(/\n/g,'<br>');
  if(best.data.internalNote){
    const noteId = `note-${++__noteIdCounter}`;
    out += `<div class="internal-note-toggle" onclick="toggleNote('${noteId}')">🔒 內部處理提示</div><div class="internal-note" id="${noteId}" style="display:none;">${esc(best.data.internalNote).replace(/\n/g,'<br>')}</div>`;
  }
  return out;
}
function sendKBChat(){
  const input = document.getElementById('kbChatInput');
  const val = input.value.trim();
  if(!val) return;
  logSearchToGoogleForm({ category: '客服知識庫', actionType: '跨品牌 AI 問答' });
  const win = document.getElementById('kbChatWindow');
  win.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(val)}</div>`);
  input.value = '';
  win.scrollTop = win.scrollHeight;
  setTimeout(()=>{
    const answer = findGlobalAnswer(val);
    const reply = answer
      ? answer
      : `目前跨品牌資料庫中查無與「${esc(val)}」相關的解答。可切換至「QA查詢」頁籤瀏覽完整清單，或洽詢客服，謝謝。`;
    win.insertAdjacentHTML('beforeend', `<div class="msg bot">${reply}</div>`);
    win.scrollTop = win.scrollHeight;
  }, 300);
}
function smartQAFilter(all, keyword){
  const q = (keyword||'').trim();
  if(!q) return all;
  const qLower = q.toLowerCase();
  const scored = all.map(item=>{
    let s = matchScore(q, item.q) + qaIntentBoost(q, item.q) + keywordBoost(q, item);
    if(item.q.toLowerCase().includes(qLower) || item.a.toLowerCase().includes(qLower)) s += 1;
    if((item.keywords||[]).some(kw=>kw.toLowerCase().includes(qLower) || qLower.includes(kw.toLowerCase()))) s += 1;
    return { item, s };
  }).filter(x=>x.s >= 0.2).sort((a,b)=>b.s-a.s);
  return scored.map(x=>x.item);
}

function productCardHTML(b, p, idx){
  const displayPrice = p.original || p.price;
  const highlightLine = p.highlights && p.highlights.length
    ? p.highlights.slice(0,3).map(h=>h.split(/[：，,]/)[0]).join(' ・ ')
    : '';
  return `
    <div class="product-card ${p.discontinued?'is-discontinued':''}" style="--band-color:${b.color}" onclick="showProductDetail('${b.id}', ${idx})">
      ${p.nickname ? `<div class="pc-nickname">${esc(p.nickname)}</div>` : ''}
      <div class="pc-eyebrow">${esc(b.name)}${p.spec ? ` ・ ${esc(p.spec)}`:''}</div>
      <div class="pname">${esc(p.name)}</div>
      ${highlightLine ? `<div class="pc-highlight">${esc(highlightLine)}</div>` : ''}
      ${p.intro ? `<div class="pc-desc">${esc(p.intro)}</div>` : ''}
      ${p.sample ? `<span class="tag-sample">範例資料</span>` : ''}
      ${p.soldout ? `<span class="tag-soldout">目前售完</span>` : ''}
      ${p.discontinued ? `<span class="tag-discontinued">已停售停產</span>` : ''}
      <div class="pfoot">
        <div class="pprice">${esc(displayPrice)}</div>
        <div class="pmore">查看完整介紹 ${ICONS.arrow}</div>
      </div>
    </div>
  `;
}
function paintProducts(b, list){
  document.getElementById('pqCount').textContent = `共 ${list.length} 項產品`;
  const wrap = document.getElementById('productSections');
  if(!list.length){
    wrap.innerHTML = `<div class="empty-state">找不到符合的產品</div>`;
    return;
  }
  const active = list.filter(p=>!p.discontinued);
  const gone = list.filter(p=>p.discontinued);
  let html = '';
  if(active.length){
    html += gone.length ? `<div class="section-label"><h2>販售中</h2><span>共 ${active.length} 項</span></div>` : '';
    html += `<div class="product-grid">${active.map(p=>productCardHTML(b,p,b.products.indexOf(p))).join('')}</div>`;
  }
  if(gone.length){
    html += `<div class="section-label discontinued-label"><h2>已停售 / 停產</h2><span>共 ${gone.length} 項（僅供查詢歷史資料）</span></div>`;
    html += `<div class="product-grid">${gone.map(p=>productCardHTML(b,p,b.products.indexOf(p))).join('')}</div>`;
  }
  if(!active.length && !gone.length){
    html = `<div class="empty-state">找不到符合的產品</div>`;
  }
  wrap.innerHTML = html;
}

function filterQAList(brandId, keyword){
  const b = getBrand(brandId);

function textBigrams(s){
  const clean = (s||'').replace(/[\s，。！？、,.!?～~：:（）()「」『』【】\/／\-—]/g,'');
  const arr = [];
  for(let i=0;i<clean.length-1;i++) arr.push(clean.substr(i,2));
  return arr;
}
function matchScore(query, text){
  if(!text) return 0;
  const qGrams = textBigrams(query);
  if(!qGrams.length) return 0;
  const tSet = new Set(textBigrams(text));
  let score = 0;
  qGrams.forEach(g=>{ if(tSet.has(g)) score++; });
  return score / qGrams.length; // normalized 0~1
}
const QA_INTENT_TERMS = ['孕婦','孕期','懷孕','哺乳','酒精','香精','香料','全素','動物實驗','蠶豆症','過敏','敏感肌','冷藏','保存期限','變質','沉澱','發炎','傷口','小孩','兒童','寶寶','嬰兒','術後','醫美','刺激','脫皮','受損','頭皮','指甲','蜜粉','色號','黑眼圈','起泡','泡沫','生髮','脫髮','掉髮','過度清潔','乾燥','染色','上色','褪色','維持','燙髮','鬢角','眉毛','手套','弄到','沾到','肝斑','斑點','美白','淡斑','痘疤','痘痘','粉刺','眼袋','脂肪球','雷射','類固醇','防腐劑','搭配乳液','按壓','滴管','蟎蟲','酒糟','毛囊角化'];
function qaIntentBoost(query, qaQuestion){
  let boost = 0;
  QA_INTENT_TERMS.forEach(term=>{
    if(query.includes(term) && qaQuestion.includes(term)) boost += 0.8;
  });
  return boost;
}
// 若QA項目有自訂 keywords 陣列（例如 keywords:['孕婦','懷孕','哺乳']），
// 只要問題裡出現任一關鍵字，就大幅加分，比對更精準且不需仰賴文字重疊率。
function keywordBoost(query, item){
  if(!item.keywords || !item.keywords.length) return 0;
  let boost = 0;
  item.keywords.forEach(kw=>{
    if(query.includes(kw)) boost += 1.2;
  });
  return boost;
}
function findAnswer(b, query){
  // 1) match against brand Q&A (compute independently first)
  let bestQA = { score:0, data:null };
  (b.qa||[]).forEach(item=>{
    const s = matchScore(query, item.q) + qaIntentBoost(query, item.q) + keywordBoost(query, item);
    if(s > bestQA.score) bestQA = { score:s, data:item };
  });
  // also check per-product QA if present
  (b.products||[]).forEach(p=>{
    (p.qa||[]).forEach(item=>{
      const s = matchScore(query, item.q) + qaIntentBoost(query, item.q) + keywordBoost(query, item);
      if(s > bestQA.score) bestQA = { score:s, data:item };
    });
  });
  // 2) match against product data (name / nickname / spec / intro / highlights / ingredients / usage / audience / caution)
  let bestProduct = { score:0, data:null };
  (b.products||[]).forEach(p=>{
    const combined = [p.name, p.nickname, p.spec, p.intro, (p.highlights||[]).join('。'), (p.ingredients||[]).join('。'), p.usage, p.audience, p.caution].filter(Boolean).join('。');
    let s = matchScore(query, combined);
    // boost 1: name/nickname bigram overlap weighted heavier than general text (product identity signal)
    const nameText = [p.name, p.nickname].filter(Boolean).join('　');
    s += matchScore(query, nameText) * 0.6;
    // boost 2: query contains full name/nickname, or contains a distinctive substring (2+ chars) of the product's name
    const idNames = [p.name, p.nickname].filter(Boolean);
    idNames.forEach(nm=>{
      const nmClean = nm.replace(/[\s（）()【】0-9%．.＋+／\/－\-]/g,'');
      if(nmClean.length >= 2 && (query.includes(nmClean) || nmClean.includes(query.replace(/[？?，,。.\s]/g,'')))){
        s += 0.3;
      }
      // partial: any 2-4 char trailing segment of the product-type word (e.g. 精華液/爽膚棉/面膜) found in query
      for(let len=4; len>=2; len--){
        if(nmClean.length>=len){
          const tail = nmClean.slice(-len);
          if(query.includes(tail)){ s += 0.15; break; }
        }
      }
    });
    // boost 3: intent keyword overlap between query and this product's audience/caution text
    s += qaIntentBoost(query, (p.audience||'') + (p.caution||'')) * 0.4;
    if(s > bestProduct.score) bestProduct = { score:s, data:p };
  });
  const THRESHOLD = 0.24;
  let best;
  if(bestQA.score >= bestProduct.score){
    best = { score:bestQA.score, type:'qa', data:bestQA.data };
  } else {
    best = { score:bestProduct.score, type:'product', data:bestProduct.data };
  }
  if(best.score < THRESHOLD || !best.data) return null;
  if(best.type === 'qa'){
    let out = esc(best.data.a).replace(/\n/g,'<br>');
    if(best.data.internalNote){
      const noteId = `note-${++__noteIdCounter}`;
      out += `<div class="internal-note-toggle" onclick="toggleNote('${noteId}')">🔒 內部處理提示</div><div class="internal-note" id="${noteId}" style="display:none;">${esc(best.data.internalNote).replace(/\n/g,'<br>')}</div>`;
    }
    return out;
  }
  // product match: assemble answer strictly from stored fields, no invented text
  const p = best.data;
  const formatMultiline = s => esc(s).replace(/\n/g,'<br>').replace(/(【[^【】]+】)/g,'<br><span class="pd-usage-heading">$1</span><br>').replace(/^(<br>)+/,'');
  let parts = [];
  parts.push(`關於「${esc(p.nickname ? p.nickname+' '+p.name : p.name)}」：`);
  if(p.intro) parts.push(esc(p.intro));
  if(p.ingredients && p.ingredients.length) parts.push(`主要成分：${p.ingredients.map(esc).join('；')}`);
  if(p.usage) parts.push(`使用方法：${formatMultiline(p.usage)}`);
  if(p.audience) parts.push(`適用族群：${formatMultiline(p.audience)}`);
  if(p.caution) parts.push(`注意事項：${formatMultiline(p.caution)}`);
  return parts.join('<br><br>');
}
function sendChat(brandId){
  const b = getBrand(brandId);
  const input = document.getElementById('chatInput');
  const val = input.value.trim();
  if(!val) return;
  logSearchToGoogleForm({ brand: b.name, category: '產品知識庫', actionType: 'AI 問答', productName: val });
  const win = document.getElementById('chatWindow');
  win.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(val)}</div>`);
  input.value = '';
  win.scrollTop = win.scrollHeight;
  setTimeout(()=>{
    const answer = findAnswer(b, val);
    const reply = answer
      ? answer
      : `目前資料庫中查無與「${esc(val)}」相關的解答。此問答僅提供品牌 Q&amp;A 與產品資料庫內已收錄的內容，若需要進一步協助，請洽詢客服或專業人員，謝謝。`;
    win.insertAdjacentHTML('beforeend', `<div class="msg bot">${reply}</div>`);
    win.scrollTop = win.scrollHeight;
  }, 300);
}
